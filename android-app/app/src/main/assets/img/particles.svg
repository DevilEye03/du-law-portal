<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#000000"/>
  <g fill="#ffffff" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Decorative Radiance Ring -->
    <circle cx="256" cy="256" r="236" fill="none" stroke-width="2" stroke-dasharray="4 8" opacity="0.4"/>
    <circle cx="256" cy="256" r="226" fill="none" stroke-width="3" opacity="0.8"/>
    <circle cx="256" cy="256" r="218" fill="none" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.5"/>

    <!-- Central Pillar of Justice -->
    <rect x="251" y="90" width="10" height="260" rx="4"/>
    <circle cx="256" cy="90" r="14"/>
    <polygon points="256,58 266,80 246,80"/>

    <!-- Balance Crossbeam -->
    <path d="M120 150 Q256 138 392 150" fill="none" stroke-width="8"/>
    <circle cx="256" cy="144" r="9"/>
    <circle cx="120" cy="150" r="7"/>
    <circle cx="392" cy="150" r="7"/>

    <!-- Left Scale Strings & Pan -->
    <line x1="120" y1="150" x2="80" y2="250" stroke-width="3"/>
    <line x1="120" y1="150" x2="160" y2="250" stroke-width="3"/>
    <path d="M70 250 Q120 286 170 250 Z" stroke-width="3"/>
    <path d="M74 252 Q120 278 166 252" fill="none" stroke-width="2" opacity="0.6"/>

    <!-- Right Scale Strings & Pan -->
    <line x1="392" y1="150" x2="352" y2="250" stroke-width="3"/>
    <line x1="392" y1="150" x2="432" y2="250" stroke-width="3"/>
    <path d="M342 250 Q392 286 442 250 Z" stroke-width="3"/>
    <path d="M346 252 Q392 278 438 252" fill="none" stroke-width="2" opacity="0.6"/>

    <!-- Pedestal / Foundation -->
    <rect x="232" y="340" width="48" height="14" rx="3"/>
    <polygon points="216,370 296,370 284,354 228,354"/>
    <rect x="190" y="370" width="132" height="16" rx="4"/>
    <rect x="170" y="386" width="172" height="14" rx="4"/>

    <!-- Open Book of Law at Base -->
    <path d="M256 324 C230 310 186 312 164 322 L164 362 C186 352 230 350 256 364 C282 350 326 352 348 362 L348 322 C326 312 282 310 256 324 Z" stroke-width="4"/>
    <line x1="256" y1="324" x2="256" y2="364" stroke-width="4"/>

    <!-- Laurel Leaves Left -->
    <g fill="#ffffff" stroke="none" opacity="0.85">
      <path d="M80 340 Q94 320 86 304 Q72 318 80 340 Z"/>
      <path d="M72 290 Q88 274 84 256 Q66 270 72 290 Z"/>
      <path d="M74 240 Q94 228 92 210 Q74 220 74 240 Z"/>
      <path d="M86 190 Q106 182 108 164 Q88 172 86 190 Z"/>
    </g>

    <!-- Laurel Leaves Right -->
    <g fill="#ffffff" stroke="none" opacity="0.85">
      <path d="M432 340 Q418 320 426 304 Q440 318 432 340 Z"/>
      <path d="M440 290 Q424 274 428 256 Q446 270 440 290 Z"/>
      <path d="M438 240 Q418 228 420 210 Q438 220 438 240 Z"/>
      <path d="M426 190 Q406 182 404 164 Q424 172 426 190 Z"/>
    </g>

    <!-- Stars & Celestial Dots -->
    <circle cx="256" cy="36" r="5" fill="#ffffff" stroke="none"/>
    <circle cx="160" cy="94" r="4" fill="#ffffff" stroke="none" opacity="0.7"/>
    <circle cx="352" cy="94" r="4" fill="#ffffff" stroke="none" opacity="0.7"/>
    <circle cx="100" cy="380" r="3.5" fill="#ffffff" stroke="none" opacity="0.6"/>
    <circle cx="412" cy="380" r="3.5" fill="#ffffff" stroke="none" opacity="0.6"/>
  </g>
</svg>
